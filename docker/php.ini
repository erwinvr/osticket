; Configuración PHP para desarrollo local de osTicket
display_errors = On
display_startup_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
log_errors = On
error_log = /dev/stderr

memory_limit = 256M
upload_max_filesize = 32M
post_max_size = 32M
max_execution_time = 120
date.timezone = UTC

; OPcache revalida en cada request para ver los cambios al instante
opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0

apc.enable_cli = 1

; Todo el correo saliente (mail()) se captura en Mailpit
sendmail_path = "/usr/bin/msmtp -t --host=mailpit --port=1025 --auto-from=on"

; Xdebug apagado por defecto; activarlo con XDEBUG_MODE=debug en .env
xdebug.mode = ${XDEBUG_MODE}
xdebug.start_with_request = yes
xdebug.client_host = host.docker.internal
xdebug.client_port = 9003
xdebug.log_level = 0
